name: PR 19 CI Debug

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  apply-modelstore-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ane-native-w8-pack
      - name: Remove redundant ModelStore ANE preparation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AnimaXS/Runtime/ModelStore/ModelStore.swift')
          s = p.read_text()

          replacements = [
          ('''        if receiptIsValid(for: entry, at: destination) {
            do {
                try ensureANEPreparationIfNeeded(for: entry, at: destination)
                states[entry.component] = .ready(destination)
                return .ready(destination)
            } catch {
                let message = error.localizedDescription
                states[entry.component] = .failed(message)
                return .failed(message)
            }
        }
''', '''        if receiptIsValid(for: entry, at: destination) {
            states[entry.component] = .ready(destination)
            return .ready(destination)
        }
'''),
          ('''            let variant = try verifier(destination, entry)
            try ensureANEPreparationIfNeeded(for: entry, at: destination)
            writeReceipt(for: entry, at: destination, variant: variant)
''', '''            let variant = try verifier(destination, entry)
            writeReceipt(for: entry, at: destination, variant: variant)
'''),
          ('''        let finalURL = try installVerified(staging, to: destination, entry: entry)
        try ensureANEPreparationIfNeeded(for: entry, at: finalURL)
        writeReceipt(for: entry, at: finalURL, variant: variant.matched)
''', '''        let finalURL = try installVerified(staging, to: destination, entry: entry)
        writeReceipt(for: entry, at: finalURL, variant: variant.matched)
'''),
          ('''            let finalURL = try installVerified(staging, to: destination, entry: entry)
            try ensureANEPreparationIfNeeded(for: entry, at: finalURL)
            writeReceipt(for: entry, at: finalURL, variant: variant.matched)
''', '''            let finalURL = try installVerified(staging, to: destination, entry: entry)
            writeReceipt(for: entry, at: finalURL, variant: variant.matched)
'''),
          ('''    /// Native ANE packs have a derived Espresso cache that must exist before
    /// the DiT slot becomes ready. Normal W4/W8-v2 packs return immediately.
    /// This never downloads a model and never runs private ANE evaluation.
    private func ensureANEPreparationIfNeeded(
        for entry: ModelManifestEntry, at url: URL
    ) throws {
        guard entry.component == .dit else { return }
        let file = try AnimapkFile(url: url)
        guard file.quantScheme == ANEW8NativePack.quantScheme else { return }
        _ = try ANEW8ModelPreparer.ensurePrepared(file: file)
    }

''', ''),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, got {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          if 'ensureANEPreparationIfNeeded' in s:
              raise SystemExit('stale ensureANEPreparationIfNeeded reference remains')

          p.write_text(s)
          PY
          xcrun swiftc -parse AnimaXS/Runtime/ModelStore/ModelStore.swift
          git diff --check
      - name: Commit and push source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AnimaXS/Runtime/ModelStore/ModelStore.swift
          git commit -m 'Keep ANE preparation at diffusion boundary only'
          git push origin HEAD:feat/ane-native-w8-pack

  simulator-test-diagnostic:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            .derivedData-debug/SourcePackages
          key: animaxs-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            animaxs-spm-${{ runner.os }}-
      - name: Select Xcode 26.3 + Metal toolchain
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Find and reset an iPhone simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(dv['udid']) for rt in d['devices'].values() for dv in rt if 'iPhone' in dv['name'] and dv['isAvailable']]" \
            | head -1)
          [ -n "$DEST" ] || { echo "::error::No available iPhone simulator"; exit 1; }
          echo "sim=$DEST" >> "$GITHUB_OUTPUT"
          xcrun simctl shutdown "$DEST" 2>/dev/null || true
          xcrun simctl erase "$DEST"
      - name: Run and capture simulator tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData-debug \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/simulator-tests.log"
      - name: Post focused simulator diagnostic to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - "$RUNNER_TEMP/simulator-tests.log" <<'PY' > "$RUNNER_TEMP/simulator-diagnostic.md"
          import pathlib, re, sys

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text(errors="replace").splitlines() if path.exists() else []
          patterns = [
              re.compile(r"(?:^|\s)(?:fatal )?error:\s", re.I),
              re.compile(r"Test Case .* failed", re.I),
              re.compile(r"XCTAssert\w* failed", re.I),
              re.compile(r"\bfailed:\s", re.I),
              re.compile(r"Testing failed", re.I),
              re.compile(r"Executed \d+ tests?, with \d+ failures?", re.I),
              re.compile(r"\*\* TEST FAILED \*\*", re.I),
          ]
          hits = [i for i, line in enumerate(lines) if any(p.search(line) for p in patterns)]
          selected = []
          seen = set()
          for i in hits[:80]:
              for j in range(max(0, i - 2), min(len(lines), i + 3)):
                  if j not in seen:
                      seen.add(j)
                      selected.append(lines[j])
          if not selected:
              selected = lines[-180:]

          print("<!-- animaxs-simulator-debug -->")
          print("### Simulator test diagnostic")
          print("```text")
          for line in selected[:240]:
              print(line[:4000])
          print("```")
          PY
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/simulator-diagnostic.md"
