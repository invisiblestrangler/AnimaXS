name: Quality W8 block localization

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      capture_run_id:
        required: false
        type: string
        default: ""
      capture_sha:
        required: false
        type: string
        default: ""
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: quality-w8-latent-${{ github.sha }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  W8_REPO: ScalingBiz/AnimaXS-DiT-W8
  W8_REVISION: 589d028122f872e66ee20cdd12cb55eb3b816add
  W8_FILE: anima-turbo-v1.0-xsmax-w8-v2.animapk
  W8_BYTES: "2232975360"
  W8_SHA: 8b63c7fd9b5872805e5a2ba799ab6d79989c54a6a89a4f34edf022c59c9ed130

jobs:
  metal_block_capture:
    if: inputs.capture_run_id == ''
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode and ensure Metal toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
      - name: Download and verify exact W8 and Qwen packs
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/models"
          fixture="AnimaXSTests/Fixtures/Case1Binary"
          mkdir -p "$model_dir"
          curl --fail --location --retry 3 --retry-all-errors -sS \
            -o "$model_dir/$W8_FILE" \
            "https://huggingface.co/$W8_REPO/resolve/$W8_REVISION/$W8_FILE?download=true"
          test "$(wc -c < "$model_dir/$W8_FILE" | tr -d ' ')" = "$W8_BYTES"
          echo "$W8_SHA  $model_dir/$W8_FILE" | shasum -a 256 --check
          qwen="$model_dir/qwen3-0.6b-xsmax-w8.animapk"
          curl --fail --location --retry 3 --retry-all-errors -sS -o "$qwen" \
            https://github.com/invisiblestrangler/AnimaXS/releases/download/model-assets-v1/qwen3-0.6b-xsmax-w8.animapk
          test "$(wc -c < "$qwen" | tr -d ' ')" = "635305984"
          echo "ba59e4d1797de5f6512aeafcecf3f38e1f62a47313a2a400b949c9018d84ceab  $qwen" | shasum -a 256 --check
          cp "$qwen" "$fixture/qwen3-0.6b-xsmax-w8.animapk"
          cp "$model_dir/$W8_FILE" "$fixture/anima-turbo-refine.animapk"
          printf '%s\n' '{"attention_numerics":"legacy","latent_only":"1","capture_block0":"1"}' \
            > "$fixture/quality-diagnostic.json"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          destination=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for r in d['devices'].values() for x in r if 'iPhone' in x['name'] and x['isAvailable']))")
          echo "id=$destination" >> "$GITHUB_OUTPUT"
      - name: Run W8 legacy-attention block capture
        run: |
          set -euo pipefail
          xcodebuild -project AnimaXS.xcodeproj -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath .derivedData CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/w8-block0.xcresult" \
            -only-testing:AnimaXSTests/FullInferenceTests/testCanonicalProductionInference \
            test 2>&1 | tee "$RUNNER_TEMP/w8-block0-capture.log"
          grep -q 'FULL_ATTENTION_NUMERICS=legacy' "$RUNNER_TEMP/w8-block0-capture.log"
          grep -q 'FULL_LATENT_ONLY=PASS' "$RUNNER_TEMP/w8-block0-capture.log"
        timeout-minutes: 90
      - name: Export block-0 attachments and provenance
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/w8-block0-capture"
          raw="$RUNNER_TEMP/w8-block0-export"
          mkdir -p "$out" "$raw"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/w8-block0.xcresult" --output-path "$raw"
          python3 scripts/export_block0_attachments.py "$raw" "$out"
          cp "$RUNNER_TEMP/w8-block0-capture.log" "$out/"
          python3 - "$out/provenance.json" "$out" <<'PY'
          import hashlib, json, os, sys
          destination, root = sys.argv[1:]
          files = {}
          for name in sorted(os.listdir(root)):
              path = os.path.join(root, name)
              if os.path.isfile(path):
                  with open(path, "rb") as handle:
                      files[name] = {"bytes": os.path.getsize(path), "sha256": hashlib.sha256(handle.read()).hexdigest()}
          payload = {"git_sha": os.environ["GITHUB_SHA"], "attention": "legacy", "sigma": 1.0,
                     "w8_revision": os.environ["W8_REVISION"], "w8_sha256": os.environ["W8_SHA"],
                     "source_revision": "f7382c4bf9d7ffe4ceea593a0adbb470c56dd79b",
                     "source_sha256": "c0b905034510750a505d21aa96c81718f4ffcc500777318421f58a88636e2174",
                     "byte_order": "little", "files": files}
          with open(destination, "w") as handle: json.dump(payload, handle, indent=2, sort_keys=True)
          PY
      - name: Upload latent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8-block0-capture-${{ inputs.capture_sha || github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/w8-block0-capture

  same-w8-reference:
    needs: metal_block_capture
    if: always() && (needs.metal_block_capture.result == 'success' || inputs.capture_run_id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANIMA_SOURCE_REPO: circlestone-labs/Anima
      ANIMA_SOURCE_REVISION: f7382c4bf9d7ffe4ceea593a0adbb470c56dd79b
      ANIMA_SOURCE_FILE: split_files/diffusion_models/anima-turbo-v1.0.safetensors
      ANIMA_SOURCE_SHA256: c0b905034510750a505d21aa96c81718f4ffcc500777318421f58a88636e2174
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bounded reference dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download macOS block capture
        uses: actions/download-artifact@v5
        with:
          name: w8-block0-capture-${{ inputs.capture_sha || github.sha }}
          path: ${{ runner.temp }}/capture
          run-id: ${{ inputs.capture_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify and normalize captured inputs
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/capture"
          python - "$capture" <<'PY'
          import json, os, sys
          import numpy as np
          root = sys.argv[1]
          expected = {
            "w8-step0-block0-input.f32": 1024*2048*4,
            "w8-step0-embedding.f32": 2048*4,
            "w8-step0-adaln.f32": 6144*4,
            "w8-cross-context.f16": 512*1024*2,
            "w8-rope.f32": 1024*64*4*4,
            "w8-step0-block0-after-self.f32": 1024*2048*4,
            "w8-step0-block0-after-cross.f32": 1024*2048*4,
            "w8-step0-block0-after-mlp.f32": 1024*2048*4,
          }
          for name, size in expected.items():
            actual = os.path.getsize(os.path.join(root, name))
            if actual != size: raise SystemExit(f"{name}: {actual} != {size}")
          np.fromfile(os.path.join(root, "w8-cross-context.f16"), dtype="<f2").astype("<f4").tofile(os.path.join(root, "block0_cross_ctx.f32"))
          copies = {"w8-step0-block0-input.f32":"block0_input_x.f32",
                    "w8-step0-embedding.f32":"block0_emb.f32",
                    "w8-step0-adaln.f32":"block0_adaln_lora.f32",
                    "w8-rope.f32":"block0_rope.f32"}
          for source, target in copies.items():
            with open(os.path.join(root, source), "rb") as src, open(os.path.join(root, target), "wb") as dst: dst.write(src.read())
          PY
      - name: Download and verify exact source and W8 pack
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN missing"; exit 1; }
          source="$RUNNER_TEMP/anima-source.safetensors"
          pack="$RUNNER_TEMP/$W8_FILE"
          curl --fail --location --retry 3 --retry-all-errors --progress-bar \
            -H "Authorization: Bearer $HF_TOKEN" -o "$source" \
            "https://huggingface.co/$ANIMA_SOURCE_REPO/resolve/$ANIMA_SOURCE_REVISION/$ANIMA_SOURCE_FILE?download=true"
          echo "$ANIMA_SOURCE_SHA256  $source" | sha256sum --check
          curl --fail --location --retry 3 --retry-all-errors --progress-bar -o "$pack" \
            "https://huggingface.co/$W8_REPO/resolve/$W8_REVISION/$W8_FILE?download=true"
          echo "$W8_SHA  $pack" | sha256sum --check
          echo "SOURCE=$source" >> "$GITHUB_ENV"
          echo "PACK=$pack" >> "$GITHUB_ENV"
      - name: Extract block-0 source, W8, and emulation weights
        run: |
          set -euo pipefail
          python scripts/extract_block0_weights.py --source "$SOURCE" --out "$RUNNER_TEMP/source"
          python scripts/extract_block0_weights.py --pack "$PACK" --out "$RUNNER_TEMP/quant"
          python scripts/extract_block0_weights.py --pack "$PACK" --out "$RUNNER_TEMP/emulation" --swift-projection-rounding
          for root in source quant emulation; do
            cp "$RUNNER_TEMP/capture"/block0_*.f32 "$RUNNER_TEMP/$root/"
          done
      - name: Execute source/W8/emulation block equations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results/source" "$RUNNER_TEMP/results/quant" "$RUNNER_TEMP/results/emulation"
          python scripts/dit_block0_oracle.py --in "$RUNNER_TEMP/source" --out "$RUNNER_TEMP/results/source" \
            --golden "$RUNNER_TEMP/no-golden" --skip-swift --checkpoints --weight-domain source-BF16
          python scripts/dit_block0_oracle.py --in "$RUNNER_TEMP/quant" --out "$RUNNER_TEMP/results/quant" \
            --golden "$RUNNER_TEMP/no-golden" --skip-swift --checkpoints --weight-domain exact-W8
          python scripts/dit_block0_oracle.py --in "$RUNNER_TEMP/emulation" --out "$RUNNER_TEMP/results/emulation" \
            --golden "$RUNNER_TEMP/no-golden" --skip-swift --checkpoints --weight-domain Swift-emulation \
            --boundary-dtype fp16 --legacy-attention
      - name: Compare branch update deltas
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/w8-block0-reference"
          python scripts/compare_block0_modes.py \
            --capture "$RUNNER_TEMP/capture" \
            --source "$RUNNER_TEMP/results/source" \
            --quant "$RUNNER_TEMP/results/quant" \
            --emulation "$RUNNER_TEMP/results/emulation" \
            --out "$evidence" | tee "$evidence.log"
          cp "$evidence.log" "$evidence/"
          cp "$RUNNER_TEMP/capture/provenance.json" "$evidence/capture-provenance.json"
      - name: Upload same-W8 reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8-block0-reference-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/w8-block0-reference
