name: Apply cache and 1024 patch

on:
  pull_request:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply:
    if: github.head_ref == 'experiment/ane-multiproc-production-ab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/ane-multiproc-production-ab
      - name: Correct current-source markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_cache_resolution_patch.py')
          s = p.read_text()
          s = s.replace('let ropeTable = DitRoPE.generate()', 'let values = DitRoPE.generate()')
          s = s.replace('let ropeTable = DitRoPE.generate(H: grid, W: grid)', 'let values = DitRoPE.generate(H: grid, W: grid)')
          s = s.replace(
              '    private static let latentSize = 64\\n    private static let outputSize = 512\\n',
              '    private static let latentSize = 64\\n    private static let outputChannels = 3\\n    private static let outputSize = 512\\n')
          s = s.replace(
              '    private static var latentSize: Int { GenerationGeometryRuntime.current.latentSize }\\n    private static var outputSize: Int { GenerationGeometryRuntime.current.imageSize }\\n',
              '    private static var latentSize: Int { GenerationGeometryRuntime.current.latentSize }\\n    private static let outputChannels = 3\\n    private static var outputSize: Int { GenerationGeometryRuntime.current.imageSize }\\n')
          p.write_text(s)
          PY
      - name: Apply deterministic patch with compact diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/apply_cache_resolution_patch.py > "$RUNNER_TEMP/patch.log" 2>&1
          STATUS=$?
          if [ "$STATUS" -ne 0 ]; then
            {
              echo '<!-- animaxs-source-patch-diagnostic -->'
              echo '### Source patch helper failure'
              echo
              echo '```text'
              tail -40 "$RUNNER_TEMP/patch.log"
              echo '```'
              echo
              echo "**PR merge SHA:** \`${GITHUB_SHA}\`"
            } > "$RUNNER_TEMP/comment.md"
            gh pr comment 38 --repo invisiblestrangler/AnimaXS --body-file "$RUNNER_TEMP/comment.md"
            exit "$STATUS"
          fi
      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AnimaXS AnimaXSTests
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes to commit"; exit 0; }
          git commit -m "Fix multiprocedure cache reuse and add 1024 generation"
          git push origin HEAD:experiment/ane-multiproc-production-ab
