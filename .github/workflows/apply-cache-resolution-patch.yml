name: Apply cache and 1024 patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'experiment/ane-multiproc-production-ab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/ane-multiproc-production-ab
      - name: Correct current-source marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_cache_resolution_patch.py')
          s = p.read_text()
          s = s.replace('let ropeTable = DitRoPE.generate()', 'let values = DitRoPE.generate()')
          s = s.replace('let ropeTable = DitRoPE.generate(H: grid, W: grid)', 'let values = DitRoPE.generate(H: grid, W: grid)')
          p.write_text(s)
          PY
      - name: Apply deterministic patch
        run: python3 scripts/apply_cache_resolution_patch.py
      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AnimaXS AnimaXSTests
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes to commit"; exit 0; }
          git commit -m "Fix multiprocedure cache reuse and add 1024 generation"
          git push origin HEAD:experiment/ane-multiproc-production-ab
