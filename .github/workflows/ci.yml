name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  apply-modelstore-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ane-native-w8-pack
      - name: Remove redundant ModelStore ANE preparation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AnimaXS/Runtime/ModelStore/ModelStore.swift')
          s = p.read_text()

          replacements = [
          ('''        if receiptIsValid(for: entry, at: destination) {
            do {
                try ensureANEPreparationIfNeeded(for: entry, at: destination)
                states[entry.component] = .ready(destination)
                return .ready(destination)
            } catch {
                let message = error.localizedDescription
                states[entry.component] = .failed(message)
                return .failed(message)
            }
        }
''', '''        if receiptIsValid(for: entry, at: destination) {
            states[entry.component] = .ready(destination)
            return .ready(destination)
        }
'''),
          ('''            let variant = try verifier(destination, entry)
            try ensureANEPreparationIfNeeded(for: entry, at: destination)
            writeReceipt(for: entry, at: destination, variant: variant)
''', '''            let variant = try verifier(destination, entry)
            writeReceipt(for: entry, at: destination, variant: variant)
'''),
          ('''        let finalURL = try installVerified(staging, to: destination, entry: entry)
        try ensureANEPreparationIfNeeded(for: entry, at: finalURL)
        writeReceipt(for: entry, at: finalURL, variant: variant.matched)
''', '''        let finalURL = try installVerified(staging, to: destination, entry: entry)
        writeReceipt(for: entry, at: finalURL, variant: variant.matched)
'''),
          ('''            let finalURL = try installVerified(staging, to: destination, entry: entry)
            try ensureANEPreparationIfNeeded(for: entry, at: finalURL)
            writeReceipt(for: entry, at: finalURL, variant: variant.matched)
''', '''            let finalURL = try installVerified(staging, to: destination, entry: entry)
            writeReceipt(for: entry, at: finalURL, variant: variant.matched)
'''),
          ('''    /// Native ANE packs have a derived Espresso cache that must exist before
    /// the DiT slot becomes ready. Normal W4/W8-v2 packs return immediately.
    /// This never downloads a model and never runs private ANE evaluation.
    private func ensureANEPreparationIfNeeded(
        for entry: ModelManifestEntry, at url: URL
    ) throws {
        guard entry.component == .dit else { return }
        let file = try AnimapkFile(url: url)
        guard file.quantScheme == ANEW8NativePack.quantScheme else { return }
        _ = try ANEW8ModelPreparer.ensurePrepared(file: file)
    }

''', ''),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one replacement, got {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          if 'ensureANEPreparationIfNeeded' in s:
              raise SystemExit('stale ensureANEPreparationIfNeeded reference remains')

          p.write_text(s)
          PY
          xcrun swiftc -parse AnimaXS/Runtime/ModelStore/ModelStore.swift
          git diff --check
      - name: Commit and push source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AnimaXS/Runtime/ModelStore/ModelStore.swift
          git commit -m 'Keep ANE preparation at diffusion boundary only'
          git push origin HEAD:feat/ane-native-w8-pack

  # Job 1 — project consistency: regenerate from project.yml, fail if committed project differs.
  project-consistency:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3 (fail if wrong)
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          V=$(xcodebuild -version | awk '/Xcode/{print $2}')
          echo "Xcode $V"
          [ "$V" = "26.3" ] || { echo "Expected Xcode 26.3, got $V"; exit 1; }
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          df -h
      - name: Ensure Metal toolchain
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler missing — downloading MetalToolchain component"
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          else
            echo "Metal compiler present: $(xcrun --find metal)"
          fi
      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          xcodegen version
      - name: Require committed xcodeproj
        run: |
          if ! git ls-files --error-unmatch AnimaXS.xcodeproj >/dev/null 2>&1; then
            echo "::error::AnimaXS.xcodeproj is not committed. Run the bootstrap-project workflow (or push after it commits) so the generated project exists."
            exit 1
          fi
      - name: Regenerate and assert no diff
        run: |
          xcodegen generate
          if ! git diff --exit-code -- AnimaXS.xcodeproj project.yml; then
            echo "::error::Committed xcodeproj out of sync with project.yml. Run bootstrap-project workflow or commit the regeneration."
            exit 1
          fi

  # Job 2 — iPhone (device) build without signing.
  iphone-build:
    runs-on: macos-15
    needs: project-consistency
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3 + Metal toolchain
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Build for generic iOS device (no signing)
        run: |
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Job 3 — simulator unit tests (discover an available iPhone simulator dynamically).
  simulator-tests:
    runs-on: macos-15
    needs: project-consistency
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          # Cache only the SPM dependency *sources* (downloaded checkouts), not build products,
          # so restored artifacts are never stale vs the current Swift sources.
          path: |
            .derivedData/SourcePackages
          key: animaxs-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            animaxs-spm-${{ runner.os }}-
      - name: Select Xcode 26.3 + Metal toolchain
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Find an available iPhone simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(dv['udid']) for rt in d['devices'].values() for dv in rt if 'iPhone' in dv['name'] and dv['isAvailable']]" \
            | head -1)
          [ -n "$DEST" ] || { echo "::error::No available iPhone simulator"; exit 1; }
          echo "Using simulator udid: $DEST"
          echo "sim=$DEST" >> "$GITHUB_OUTPUT"
      - name: Reset selected simulator state
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.sim }}"
          [ -n "$UDID" ] || { echo "::error::No simulator UDID selected"; exit 1; }
          echo "Resetting selected simulator before pack-free tests"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
      - name: Run unit tests on simulator (timeout-guarded)
        run: |
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
        timeout-minutes: 30

  # Pure-reference and pack-free Metal/MPS tests are folded into simulator-tests.
  # There is no duplicate test job because swift-transformers is expensive to build.
