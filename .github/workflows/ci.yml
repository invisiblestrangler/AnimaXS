name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # Temporary V5 materializer. It runs only for the human-authored V5 PR head,
  # writes the generated multifunction asset + Swift diagnostic shims, restores
  # this workflow from main, and pushes one bot commit. The resulting PR run
  # therefore uses the normal CI file with no permanent workflow changes.
  materialize-v5:
    if: github.head_ref == 'probe/ane-v5-michelin' && github.actor != 'github-actions[bot]'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe/ane-v5-michelin
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Generate two-function Core ML asset
        run: |
          set -euo pipefail
          python -m pip install --quiet 'coremltools==8.1' numpy
          TMP="$RUNNER_TEMP/ane-v5-multifunction"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          python - <<'PY'
          import os
          import numpy as np
          import coremltools as ct
          from coremltools.converters.mil import Builder as mb, types

          root = os.environ['RUNNER_TEMP'] + '/ane-v5-multifunction'

          def make_program(scale, path):
              weight = np.zeros((64, 64, 1, 1), dtype=np.float16)
              for i in range(64):
                  weight[i, i, 0, 0] = np.float16(scale)

              @mb.program(
                  input_specs=[mb.TensorSpec(shape=(1, 64, 1, 64), dtype=types.fp16)],
                  opset_version=ct.target.iOS18,
              )
              def prog(x):
                  return mb.conv(x=x, weight=weight, pad_type='valid', name='y')

              model = ct.convert(
                  prog,
                  convert_to='mlprogram',
                  minimum_deployment_target=ct.target.iOS18,
                  compute_precision=ct.precision.FLOAT16,
              )
              model.save(path)

          a = os.path.join(root, 'proc_a.mlpackage')
          b = os.path.join(root, 'proc_b.mlpackage')
          out = os.path.join(root, 'V5TwoProcedure.mlpackage')
          make_program(1.0, a)
          make_program(2.0, b)

          desc = ct.utils.MultiFunctionDescriptor()
          desc.add_function(
              model_path=a,
              source_function_name='main',
              target_function_name='identity',
          )
          desc.add_function(
              model_path=b,
              source_function_name='main',
              target_function_name='double',
          )
          desc.default_function_name = 'identity'
          ct.utils.save_multifunction(desc, out)
          print('generated', out)
          PY

          mkdir -p "$TMP/compiled"
          xcrun coremlcompiler compile "$TMP/V5TwoProcedure.mlpackage" "$TMP/compiled"
          test -d "$TMP/compiled/V5TwoProcedure.mlmodelc"
          DEST="AnimaXS/Resources/ANE/Conv2048W8Template.bundle/V5TwoProcedure.mlmodelc"
          rm -rf "$DEST"
          cp -R "$TMP/compiled/V5TwoProcedure.mlmodelc" "$DEST"
          find "$DEST" -maxdepth 2 -type f -print

      - name: Add V5 Swift diagnostic shims and UI label
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('AnimaXS/App/ANERingProbe.swift')
          s = p.read_text()
          marker = '// MARK: - V5 existing-bridge diagnostic shims'
          if marker not in s:
              s += r'''

// MARK: - V5 existing-bridge diagnostic shims

/// Times exactly the synchronous destroy path production currently pays.
/// `invalidate()` performs the private unload and drops the retained _ANEModel.
private extension A12ANEProjectionModel {
    func diagnosticDestroyMilliseconds() -> Double {
        let started = ProcessInfo.processInfo.systemUptime
        invalidate()
        return (ProcessInfo.processInfo.systemUptime - started) * 1_000
    }
}

private extension A12ANEQKVModel {
    func diagnosticDestroyMilliseconds() -> Double {
        let started = ProcessInfo.processInfo.systemUptime
        invalidate()
        return (ProcessInfo.processInfo.systemUptime - started) * 1_000
    }
}

/// Reuses the existing prepared-model bridge rather than adding new private
/// selectors. The compiled multifunction asset is staged under the exact cache
/// namespace A12PreparedModelURL already consumes, then the normal prepared
/// projection wrapper reports private procedure metadata and load timing.
private func A12ANEMultiProcedureProbe(
    _ compiledModelURL: URL,
    _ channels: UInt,
    _ spatial: UInt
) -> String {
    let fileManager = FileManager.default
    let cacheKey = "v5-two-procedure-poc"
    do {
        guard let caches = fileManager.urls(for: .cachesDirectory, in: .userDomainMask).first else {
            return "private multifunction ERROR: caches directory unavailable"
        }
        let base = caches.appendingPathComponent("AnimaXS-ANE", isDirectory: true)
        try fileManager.createDirectory(at: base, withIntermediateDirectories: true)
        let destination = base.appendingPathComponent("\(cacheKey).mlmodelc", isDirectory: true)
        if fileManager.fileExists(atPath: destination.path) {
            try fileManager.removeItem(at: destination)
        }
        try fileManager.copyItem(at: compiledModelURL, to: destination)

        let loadStarted = ProcessInfo.processInfo.systemUptime
        let model = try A12ANEProjectionModel(
            preparedInputChannels: channels,
            outputChannels: channels,
            spatial: spatial,
            label: "v5_two_procedure",
            cacheKey: cacheKey)
        let loadWall = (ProcessInfo.processInfo.systemUptime - loadStarted) * 1_000
        let count = model.procedureCount
        let summary = model.procedureSummary
        let loadANE = model.loadMilliseconds
        let unloadStarted = ProcessInfo.processInfo.systemUptime
        model.invalidate()
        let unloadWall = (ProcessInfo.processInfo.systemUptime - unloadStarted) * 1_000
        try? fileManager.removeItem(at: destination)
        return String(
            format: "private multifunction: procedures=%lu summary=%@ loadANE=%.1fms loadWall=%.1fms unloadWall=%.1fms",
            count, summary, loadANE, loadWall, unloadWall)
    } catch {
        return "private multifunction ERROR: \(error.localizedDescription)"
    }
}
'''
          s = s.replace('unloadANE=', 'unloadCallSum=')
          s = s.replace('unloadANE=\\(ms(stats.unloadANE))', 'unloadCallSum=\\(ms(stats.unloadANE))')
          p.write_text(s)

          d = Path('AnimaXS/App/DiagnosticsView.swift')
          s = d.read_text()
          s = s.replace(
              'Device-only ANE streaming-ring probe v3. Tests the production candidate with zero pinned blocks and only two block slices resident at once (8 current + 8 prefetched programs), including a full 28-block warm rotation and sustained load/evaluate overlap. It never runs automatically or modifies model weights.',
              'Device-only ANE Michelin probe v5. Measures synchronous destroy/unload, compares corrected 0+2 vs 0+3 vs 2+3 streaming, and independently probes whether a two-function Core ML asset appears as multiple private ANE procedures. It never runs automatically or modifies model weights.')
          s = s.replace('Run ANE streaming-ring probe', 'Run ANE Michelin probe v5')
          s = s.replace('Running ANE ring probe…', 'Running ANE Michelin probe…')
          d.write_text(s)
          PY

      - name: Restore normal CI and remove temporary V5 materializers
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git rm -f .github/workflows/materialize-ane-v5.yml _ane_v5_trigger.txt || true

      - name: Commit generated V5 support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AnimaXS/App/ANERingProbe.swift AnimaXS/App/DiagnosticsView.swift
          git add AnimaXS/Resources/ANE/Conv2048W8Template.bundle/V5TwoProcedure.mlmodelc
          git add .github/workflows/ci.yml
          git add -u .github/workflows/materialize-ane-v5.yml _ane_v5_trigger.txt || true
          git commit -m 'diag: materialize ANE Michelin V5 support'
          git push origin HEAD:probe/ane-v5-michelin

  # Job 1 — project consistency: regenerate from project.yml, fail if committed project differs.
  project-consistency:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3 (fail if wrong)
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          V=$(xcodebuild -version | awk '/Xcode/{print $2}')
          echo "Xcode $V"
          [ "$V" = "26.3" ] || { echo "Expected Xcode 26.3, got $V"; exit 1; }
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphonesimulator --show-sdk-version
          df -h
      - name: Ensure Metal toolchain
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            echo "Metal compiler missing — downloading MetalToolchain component"
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          else
            echo "Metal compiler present: $(xcrun --find metal)"
          fi
      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          xcodegen version
      - name: Require committed xcodeproj
        run: |
          if ! git ls-files --error-unmatch AnimaXS.xcodeproj >/dev/null 2>&1; then
            echo "::error::AnimaXS.xcodeproj is not committed. Run the bootstrap-project workflow (or push after it commits) so the generated project exists."
            exit 1
          fi
      - name: Regenerate and assert no diff
        run: |
          xcodegen generate
          if ! git diff --exit-code -- AnimaXS.xcodeproj project.yml; then
            echo "::error::Committed xcodeproj out of sync with project.yml. Run bootstrap-project workflow or commit the regeneration."
            exit 1
          fi

  # Job 2 — iPhone (device) build without signing.
  iphone-build:
    runs-on: macos-15
    needs: project-consistency
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.3 + Metal toolchain
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Build for generic iOS device (no signing)
        run: |
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  # Job 3 — simulator unit tests (discover an available iPhone simulator dynamically).
  simulator-tests:
    runs-on: macos-15
    needs: project-consistency
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          # Cache only the SPM dependency *sources* (downloaded checkouts), not build products,
          # so restored artifacts are never stale vs the current Swift sources.
          path: |
            .derivedData/SourcePackages
          key: animaxs-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: |
            animaxs-spm-${{ runner.os }}-
      - name: Select Xcode 26.3 + Metal toolchain
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Find an available iPhone simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(dv['udid']) for rt in d['devices'].values() for dv in rt if 'iPhone' in dv['name'] and dv['isAvailable']]" \
            | head -1)
          [ -n "$DEST" ] || { echo "::error::No available iPhone simulator"; exit 1; }
          echo "Using simulator udid: $DEST"
          echo "sim=$DEST" >> "$GITHUB_OUTPUT"
      - name: Reset selected simulator state
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.sim }}"
          [ -n "$UDID" ] || { echo "::error::No simulator UDID selected"; exit 1; }
          echo "Resetting selected simulator before pack-free tests"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
      - name: Run unit tests on simulator (timeout-guarded)
        run: |
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO \
            test
        timeout-minutes: 30

  # Pure-reference and pack-free Metal/MPS tests are folded into simulator-tests.
  # There is no duplicate test job because swift-transformers is expensive to build.