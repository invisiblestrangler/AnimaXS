name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-probe-compile-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact compiler fix and restore normal CI
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          path = Path("AnimaXS/App/DiagnosticsView.swift")
          text = path.read_text()
          old = """            total += tensor.dataSize + tensor.scaleSize + tensor.zeroSize\n"""
          new = """            guard let scaleSize = tensor.scaleSize, let zeroSize = tensor.zeroSize else {\n                throw AnimapkError.validation(\"ANE probe expected W8 scale/zero payload sizes for block \\(block) \\(spec.suffix)\")\n            }\n            total += tensor.dataSize + scaleSize + zeroSize\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected exact logicalNativeBytes line once, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY

          # The temporary diagnostic workflow must not survive the materialized commit.
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

          git diff --check
          git diff -- AnimaXS/App/DiagnosticsView.swift .github/workflows/ci.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AnimaXS/App/DiagnosticsView.swift .github/workflows/ci.yml
          git commit -m "fix: unwrap ANE probe W8 payload sizes [bot-materialized]"
          git push origin "HEAD:${HEAD_BRANCH}"
