name: Materialize ANE experiments v2

on:
  push:
    branches: [probe/ane-experiments-v2]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe/ane-experiments-v2
      - name: Materialize diagnostic experiment suite
        run: python3 .github/ane_experiments_materialize.py
      - name: Remove one-shot materializer
        run: |
          rm .github/ane_experiments_materialize.py
          rm .github/workflows/materialize-ane-experiments-v2.yml
      - name: Commit materialized source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AnimaXS/App/DiagnosticsView.swift AnimaXS/Runtime/ANE/A12ANEBridge.h AnimaXS/Runtime/ANE/A12ANEBridge.m .github
          git diff --cached --check
          git commit -m "diag: add ANE residency experiment suite v2"
          git push origin HEAD:probe/ane-experiments-v2
