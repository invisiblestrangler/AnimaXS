name: full-inference

# Manual full-model inference attempt on a macOS runner's simulator Metal device.
# This downloads the ~2.1 GB model packs from the GitHub Release (model-assets-v1),
# verifies them against the manifest, then runs FullInferenceTests in REQUIRED
# mode: any missing/mismatched pack or fixture-related skip is a FAILURE, and an
# explicit FULL_INFERENCE=PASS marker is required in the log.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Model release tag to download packs from'
        required: false
        default: 'model-assets-v1'
      case:
        description: 'Golden case to inject (case1_danbooru_seed1337)'
        required: false
        default: 'case1_danbooru_seed1337'

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  MODEL_DIR: "${{ github.workspace }}/models"

jobs:
  full-inference:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h

      - name: Ensure Metal toolchain
        run: |
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi

      - name: Find an available iPhone simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(dv['udid']) for rt in d['devices'].values() for dv in rt if 'iPhone' in dv['name'] and dv['isAvailable']]" \
            | head -1)
          [ -n "$DEST" ] || { echo "::error::No available iPhone simulator"; exit 1; }
          echo "sim=$DEST" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.sim }}" 2>/dev/null || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.sim }}" -b

      - name: Execute Metal/MPS smoke tests
        id: metal
        run: |
          set +e
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData \
            -only-testing:AnimaXSTests/MetalExecutionTests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee metal-smoke.log
          RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Metal/MPS smoke test failed"
            exit "$RESULT"
          fi
          if grep -q 'SKIPPED_NO_METAL' metal-smoke.log; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "result=SKIPPED_NO_METAL" >> "$GITHUB_OUTPUT"
          else
            grep -q 'METAL_KERNEL_SMOKE=PASS' metal-smoke.log
            grep -q 'MPS_GEMM_SMOKE=PASS' metal-smoke.log
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "result=PASS" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and verify model packs
        if: steps.metal.outputs.available == 'true'
        run: |
          set -e
          mkdir -p "$MODEL_DIR"
          TAG="${{ inputs.release }}"
          BASE="https://github.com/invisiblestrangler/AnimaXS/releases/download/$TAG"
          # Bash 3.2 (macOS default) has NO associative arrays — use a
          # line-oriented manifest loop (name expected_size expected_sha).
          # curl flags are hardened: --fail (a 404 HTML doc is never a pack),
          # --location, --retry, --retry-all-errors.
          printf '%s\n' \
            "qwen3-0.6b-xsmax-w8.animapk 635305984 ba59e4d1797de5f6512aeafcecf3f38e1f62a47313a2a400b949c9018d84ceab" \
            "anima-turbo-v1.0-xsmax-w4.animapk 1179435008 ba1ce615f03665812f05088f9239f0cb23591a0811067d57fa51773abf6f0d25" \
            "qwen-image-vae-xsmax-fp16.animapk 256163840 10171af0b826927b75fecf4482aaa0e268254874e694a0788ebdd8c4254fc447" \
            | while read -r name expected_size expected_sha; do
              [ -n "$name" ] || continue
              url="$BASE/$name"
              dest="$MODEL_DIR/$name"
              echo "Downloading $name ..."
              curl --fail --location --retry 3 --retry-all-errors -sS -o "$dest" "$url"
              [ -f "$dest" ] || { echo "::error::download failed: $name"; exit 1; }
              actual_size="$(wc -c < "$dest" | tr -d ' ')"
              actual_sha="$(shasum -a 256 "$dest" | awk '{print $1}')"
              printf 'name=%s expected_size=%s actual_size=%s\n' "$name" "$expected_size" "$actual_size"
              printf 'name=%s expected_sha=%s actual_sha=%s\n' "$name" "$expected_sha" "$actual_sha"
              if [ "$actual_size" != "$expected_size" ]; then
                echo "::error::size mismatch for $name (expected $expected_size, got $actual_size)"
                exit 1
              fi
              if [ "$actual_sha" != "$expected_sha" ]; then
                echo "::error::SHA-256 mismatch for $name"
                exit 1
              fi
              echo "$name verified"
            done
          echo "All three packs downloaded and verified."
          df -h

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Run full-model integration inference (required mode)
        if: steps.metal.outputs.available == 'true'
        env:
          ANIMAXS_RELEASE: ${{ inputs.release }}
          ANIMAXS_CASE: ${{ inputs.case }}
          ANIMAXS_REQUIRE_FULL_INFERENCE: "1"
          ANIMAXS_QWEN_PACK: "${{ env.MODEL_DIR }}/qwen3-0.6b-xsmax-w8.animapk"
          ANIMAXS_DIFFUSION_PACK: "${{ env.MODEL_DIR }}/anima-turbo-v1.0-xsmax-w4.animapk"
          ANIMAXS_VAE_PACK: "${{ env.MODEL_DIR }}/qwen-image-vae-xsmax-fp16.animapk"
          ANIMAXS_NOISE_FILE: "${{ github.workspace }}/AnimaXSTests/Fixtures/Case1Binary/case1_noise.f32"
        run: |
          set -euo pipefail
          # Robustness: xcodebuild does not reliably forward arbitrary step env
          # vars to the simulator's test process (observed: FullInferenceTests
          # skipped despite ANIMAXS_*_PACK being set in the step env). The proven
          # parity workflows (e.g. vae-parity) instead made the packs available as
          # BUNDLED test resources: copy them into the committed fixture dir and
          # regenerate the project so FullInferenceTests finds them via
          # `bundledFixture(named:)`. The packs are *.animapk (gitignored) so they
          # are never committed; the regeneration is ephemeral on the runner.
          cp "$ANIMAXS_QWEN_PACK"    AnimaXSTests/Fixtures/Case1Binary/
          cp "$ANIMAXS_DIFFUSION_PACK" AnimaXSTests/Fixtures/Case1Binary/
          cp "$ANIMAXS_VAE_PACK"     AnimaXSTests/Fixtures/Case1Binary/
          xcodegen generate
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData \
            -resultBundlePath "$RUNNER_TEMP/full-inference.xcresult" \
            -only-testing:AnimaXSTests/FullInferenceTests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee full-inference.log
          RESULT=${PIPESTATUS[0]}
          test "$RESULT" -eq 0
          # In REQUIRED mode with Metal available, a fixture skip is a FAILURE.
          if grep -q 'full inference pack' full-inference.log; then
            echo "::error::full-inference fixture skip appeared in required mode"
            exit 1
          fi
          grep -q 'FULL_INFERENCE=PASS' full-inference.log
        timeout-minutes: 90

      - name: Discover xcresulttool syntax on this runner
        if: steps.metal.outputs.available == 'true'
        run: |
          xcrun xcresulttool help export 2>&1 | tee xcresulttool-help.log || true
          echo "---"
          xcrun xcresulttool export --help 2>&1 | tee -a xcresulttool-help.log || true

      - name: Export image attachments from result bundle
        if: steps.metal.outputs.available == 'true'
        run: |
          set -euo pipefail
          ls -la "$RUNNER_TEMP/full-inference.xcresult"
          mkdir -p "$RUNNER_TEMP/exported" "$RUNNER_TEMP/artifacts"
          # Export every attachment (generated.png, reference.png,
          # comparison.png, metrics.txt) to a flat directory.
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/full-inference.xcresult" \
            --output-path "$RUNNER_TEMP/exported" 2>&1 | tee export.log
          echo "--- exported dir ---"
          ls -la "$RUNNER_TEMP/exported"
          # Normalize to canonical names regardless of any ID prefix the
          # tool adds: match by filename substring.
          find "$RUNNER_TEMP/exported" -type f \( -name '*generated*.png' \) -exec cp {} "$RUNNER_TEMP/artifacts/generated.png" \;
          find "$RUNNER_TEMP/exported" -type f \( -name '*reference*.png' \) -exec cp {} "$RUNNER_TEMP/artifacts/reference.png" \;
          find "$RUNNER_TEMP/exported" -type f \( -name '*comparison*.png' \) -exec cp {} "$RUNNER_TEMP/artifacts/comparison.png" \;
          find "$RUNNER_TEMP/exported" -type f \( -name '*metrics*.txt' \) -exec cp {} "$RUNNER_TEMP/artifacts/metrics.txt" \;
          ls -la "$RUNNER_TEMP/artifacts"
          # Fill the workflow-injected fields in metrics.txt.
          if [ -f "$RUNNER_TEMP/artifacts/metrics.txt" ]; then
            sed -i '' "s|^commit: .*|commit: ${{ github.sha }}|" "$RUNNER_TEMP/artifacts/metrics.txt"
            sed -i '' "s|^run_id: .*|run_id: ${{ github.run_id }}|" "$RUNNER_TEMP/artifacts/metrics.txt"
            cat "$RUNNER_TEMP/artifacts/metrics.txt"
          fi
          # Hard-require the four deliverables.
          for f in generated.png reference.png comparison.png metrics.txt; do
            [ -s "$RUNNER_TEMP/artifacts/$f" ] || { echo "::error::missing artifact $f"; exit 1; }
          done
          # Lossless sanity: generated/reference must be 512x512 (comparison is
          # 1024x512+). Verified via ImageIO `sips` if available.
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/artifacts/generated.png" || true
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/artifacts/reference.png" || true

      - name: Upload full-inference images artifact
        if: steps.metal.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: anima-xs-full-inference-images
          path: |
            ${{ runner.temp }}/artifacts/generated.png
            ${{ runner.temp }}/artifacts/reference.png
            ${{ runner.temp }}/artifacts/comparison.png
            ${{ runner.temp }}/artifacts/metrics.txt
          if-no-files-found: error

      - name: Report Metal availability and result
        if: always()
        run: |
          echo "Metal smoke: ${{ steps.metal.outputs.result }}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.metal.outputs.result }}" = "SKIPPED_NO_METAL" ]; then
            echo "Full inference: SKIPPED_NO_METAL" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if grep -q 'FULL_INFERENCE=PASS' full-inference.log 2>/dev/null; then
              echo "Full inference: PASS" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Full inference: FAIL" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          df -h
