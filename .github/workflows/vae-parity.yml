name: VAE parity

# Manual full-pack VAE decode validation (J002). Requires the real fp16 VAE pack
# and the Lane A same-pack decoded RGB emitted by scripts/vae_decoder_oracle.py
# (--emit-lane-a). This is a deliberate manual workflow — it does not run on push
# and must not be enabled until a temporary release carries the assets.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  vae:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select toolchain and simulator
        id: sim
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(x['udid']) for v in d['devices'].values() for x in v if 'iPhone' in x['name'] and x['isAvailable']]" \
            | head -1)
          test -n "$DEST"
          echo "sim=$DEST" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEST" 2>/dev/null || true
          xcrun simctl bootstatus "$DEST" -b
      - name: Download VAE pack + Lane A fixture
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ vars.VAE_PARITY_RELEASE }}
        run: |
          test -n "$RELEASE" || { echo "::error::VAE_PARITY_RELEASE repo variable not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/vae" AnimaXSTests/Fixtures/VAEParity
          gh release download "$RELEASE" --dir "$RUNNER_TEMP/vae"
          cp "$RUNNER_TEMP/vae/qwen-image-vae-xsmax-fp16.animapk" AnimaXSTests/Fixtures/VAEParity/
          cp "$RUNNER_TEMP/vae/vae_latent.f32" AnimaXSTests/Fixtures/VAEParity/
          cp "$RUNNER_TEMP/vae/vae_lane_a_rgb.f32" AnimaXSTests/Fixtures/VAEParity/
          shasum -a 256 "$RUNNER_TEMP/vae/qwen-image-vae-xsmax-fp16.animapk"
      - name: Regenerate ephemeral project
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Run full-frame VAE decode parity
        env:
          ANIMAXS_VAE_PACK: "${{ github.workspace }}/AnimaXSTests/Fixtures/VAEParity/qwen-image-vae-xsmax-fp16.animapk"
          ANIMAXS_VAE_ORACLE_DIR: "${{ github.workspace }}/AnimaXSTests/Fixtures/VAEParity"
        run: |
          set -o pipefail
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData \
            -only-testing:AnimaXSTests/QwenEncoderMetalTests/testRealW4VAEDecodeParity \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee vae-parity.log
          grep 'VAE_DECODE_FINAL' vae-parity.log | tee -a "$GITHUB_STEP_SUMMARY"
