name: ANE Oracle E XcodeGen Sync

on:
  push:
    branches:
      - agent/ane-oracle-e
    paths:
      - .github/workflows/ane-oracle-e-xcodegen.yml
      - AnimaXS/**/*.swift
      - project.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  sync:
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: ane-oracle-e-xcodegen
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ane-oracle-e
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Regenerate and commit project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          # Refresh to the current branch tip so an earlier queued sync can
          # never regenerate a stale checkout after newer Oracle E Swift files land.
          git fetch origin agent/ane-oracle-e
          git reset --hard origin/agent/ane-oracle-e
          xcodegen generate
          if git diff --quiet -- AnimaXS.xcodeproj project.yml; then
            echo "No generated-project changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AnimaXS.xcodeproj
          git commit -m "chore: sync xcodeproj for Oracle E capture"
          git push origin HEAD:agent/ane-oracle-e
