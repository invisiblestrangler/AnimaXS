name: I002 diffusion parity

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  diffusion:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select toolchain and simulator
        id: sim
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(x['udid']) for v in d['devices'].values() for x in v if 'iPhone' in x['name'] and x['isAvailable']]" \
            | head -1)
          test -n "$DEST"
          echo "sim=$DEST" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEST" 2>/dev/null || true
          xcrun simctl bootstatus "$DEST" -b
      - name: Download temporary full-pack fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/i002" AnimaXSTests/Fixtures/I002Full
          gh release download i002-diffusion-temp --dir "$RUNNER_TEMP/i002"
          tar -xzf "$RUNNER_TEMP/i002/i002-diffusion-oracle.tar.gz" \
            -C AnimaXSTests/Fixtures/I002Full
          cp "$RUNNER_TEMP/i002/anima-turbo-v1.0-xsmax-w4.animapk" \
            AnimaXSTests/Fixtures/I002Full/
          shasum -a 256 "$RUNNER_TEMP/i002/anima-turbo-v1.0-xsmax-w4.animapk"
      - name: Regenerate ephemeral project
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Run eight-step production loop
        run: |
          set -o pipefail
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData \
            -only-testing:AnimaXSTests/QwenEncoderMetalTests/testRealW4EightStepDiffusionLoop \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee i002-diffusion.log
          grep 'I002_DIFFUSION_' i002-diffusion.log | tee -a "$GITHUB_STEP_SUMMARY"
