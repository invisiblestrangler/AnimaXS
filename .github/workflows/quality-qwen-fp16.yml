name: Quality Qwen FP16 matrices

on:
  workflow_call:
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  SOURCE_REPO: circlestone-labs/Anima
  SOURCE_REVISION: f7382c4bf9d7ffe4ceea593a0adbb470c56dd79b
  SOURCE_FILE: split_files/text_encoders/qwen_3_06b_base.safetensors
  SOURCE_SHA256: cd2a512003e2f9f3cd3c32a9c3573f820bb28c940f73c57b1ddaa983d9223eba
  QWEN_FILE: qwen3-0.6b-xsmax-fp16-matrices.animapk
  W8_REPO: ScalingBiz/AnimaXS-DiT-W8
  W8_REVISION: 589d028122f872e66ee20cdd12cb55eb3b816add
  W8_FILE: anima-turbo-v1.0-xsmax-w8-v2.animapk
  W8_SHA256: 8b63c7fd9b5872805e5a2ba799ab6d79989c54a6a89a4f34edf022c59c9ed130

jobs:
  pack-qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install bounded pack dependencies
        run: |
          set -euo pipefail
          python -m pip install numpy safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download and verify pinned Qwen source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN missing"; exit 1; }
          source="$RUNNER_TEMP/qwen-source.safetensors"
          curl --fail --location --retry 3 --retry-all-errors --progress-bar \
            -H "Authorization: Bearer $HF_TOKEN" -o "$source" \
            "https://huggingface.co/$SOURCE_REPO/resolve/$SOURCE_REVISION/$SOURCE_FILE?download=true"
          echo "$SOURCE_SHA256  $source" | sha256sum --check
          echo "SOURCE=$source" >> "$GITHUB_ENV"
      - name: Pack source-FP16 matrices with W8 embedding
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/$QWEN_FILE"
          python scripts/pack_anima.py --component te --input "$SOURCE" --out "$out" \
            --quant w8 --precision-map scripts/qwen-fp16-matrices.json \
            --source-repo "$SOURCE_REPO" --source-revision "$SOURCE_REVISION" \
            --source-sha256 "$SOURCE_SHA256" --report "$RUNNER_TEMP/qwen-pack-report.json" --verify
          python scripts/verify_animapk.py "$out" --json > "$RUNNER_TEMP/qwen-verify.json"
          sha256sum "$out" | tee "$RUNNER_TEMP/qwen-pack.sha256"
      - name: Upload Qwen candidate
        uses: actions/upload-artifact@v4
        with:
          name: qwen-fp16-pack-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/${{ env.QWEN_FILE }}
            ${{ runner.temp }}/qwen-pack-report.json
            ${{ runner.temp }}/qwen-verify.json
            ${{ runner.temp }}/qwen-pack.sha256

  latent:
    needs: pack-qwen
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode and ensure Metal toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
      - name: Download Qwen candidate
        uses: actions/download-artifact@v5
        with:
          name: qwen-fp16-pack-${{ github.sha }}
          path: ${{ runner.temp }}/qwen-candidate
      - name: Download exact W8 DiT and prepare fixtures
        run: |
          set -euo pipefail
          fixture="AnimaXSTests/Fixtures/Case1Binary"
          dit="$RUNNER_TEMP/$W8_FILE"
          curl --fail --location --retry 3 --retry-all-errors --progress-bar -o "$dit" \
            "https://huggingface.co/$W8_REPO/resolve/$W8_REVISION/$W8_FILE?download=true"
          echo "$W8_SHA256  $dit" | shasum -a 256 --check
          cp "$RUNNER_TEMP/qwen-candidate/$QWEN_FILE" "$fixture/qwen3-0.6b-xsmax-w8.animapk"
          cp "$dit" "$fixture/anima-turbo-refine.animapk"
          printf '%s\n' '{"attention_numerics":"legacy","activation_numerics":"legacy","latent_only":"1"}' \
            > "$fixture/quality-diagnostic.json"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          destination=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for r in d['devices'].values() for x in r if 'iPhone' in x['name'] and x['isAvailable']))")
          echo "id=$destination" >> "$GITHUB_OUTPUT"
      - name: Run canonical latent inference
        run: |
          set -euo pipefail
          xcodebuild -project AnimaXS.xcodeproj -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath .derivedData CODE_SIGNING_ALLOWED=NO \
            -only-testing:AnimaXSTests/FullInferenceTests/testCanonicalProductionInference \
            test 2>&1 | tee "$RUNNER_TEMP/qwen-fp16-latent.log"
          grep -q 'FULL_QWEN_CONTEXT=production' "$RUNNER_TEMP/qwen-fp16-latent.log"
          grep -q 'FULL_LATENT_ONLY=PASS' "$RUNNER_TEMP/qwen-fp16-latent.log"
        timeout-minutes: 90
      - name: Upload latent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-fp16-latent-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/qwen-fp16-latent.log
