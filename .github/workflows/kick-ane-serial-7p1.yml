name: Kick legacy ANE serial 7+1 patch

on:
  push:
    branches:
      - experiment/ane-legacy-serial-7p1

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: experiment/ane-legacy-serial-7p1
      - name: Apply deterministic scheduler patch
        run: |
          set -euo pipefail
          sed -n "/python3 - <<'PY'/,/^          PY$/p" .github/workflows/apply-ane-serial-7p1.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply_serial_7p1.py
          python3 /tmp/apply_serial_7p1.py
          rm .github/workflows/apply-ane-serial-7p1.yml
          rm .github/workflows/kick-ane-serial-7p1.yml
          git diff --check
      - name: Commit source-only experiment
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AnimaXS/Runtime/ANE/ANEW8MLPBackend.swift .github/workflows/apply-ane-serial-7p1.yml .github/workflows/kick-ane-serial-7p1.yml
          git commit -m "Experiment with serial ANE 7+1 scheduling"
          git push origin HEAD:experiment/ane-legacy-serial-7p1
