name: Materialize ANE V5 multifunction asset

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'chore/trigger-v5-materializer-2'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe/ane-v5-michelin
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate and commit V5 support
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          LOG="$RUNNER_TEMP/v5-materializer.log"
          (
            set -euo pipefail
            python -m pip install --quiet 'coremltools==8.1' 'numpy==1.26.4'
            TMP="$RUNNER_TEMP/ane-v5-multifunction"
            rm -rf "$TMP"
            mkdir -p "$TMP"

            python - <<'PY'
          import os
          import numpy as np
          import coremltools as ct
          from coremltools.converters.mil import Builder as mb
          from coremltools.converters.mil.mil import types

          root = os.environ['RUNNER_TEMP'] + '/ane-v5-multifunction'

          def make_program(scale, path):
              weight = np.zeros((64, 64, 1, 1), dtype=np.float16)
              idx = np.arange(64)
              weight[idx, idx, 0, 0] = np.float16(scale)

              @mb.program(
                  input_specs=[mb.TensorSpec(shape=(1, 64, 1, 64), dtype=types.fp16)],
                  opset_version=ct.target.iOS18,
              )
              def prog(x):
                  return mb.conv(x=x, weight=weight, pad_type='valid', name='y')

              model = ct.convert(
                  prog,
                  convert_to='mlprogram',
                  minimum_deployment_target=ct.target.iOS18,
                  compute_precision=ct.precision.FLOAT16,
              )
              model.save(path)

          a = os.path.join(root, 'proc_a.mlpackage')
          b = os.path.join(root, 'proc_b.mlpackage')
          combined = os.path.join(root, 'V5TwoProcedure.mlpackage')
          make_program(1.0, a)
          make_program(2.0, b)

          desc = ct.utils.MultiFunctionDescriptor()
          desc.add_function(a, 'main', 'identity')
          desc.add_function(b, 'main', 'double')
          desc.default_function_name = 'identity'
          ct.utils.save_multifunction(desc, combined)
          print('generated multifunction package:', combined)
          PY

            mkdir -p "$TMP/compiled"
            xcrun coremlcompiler compile "$TMP/V5TwoProcedure.mlpackage" "$TMP/compiled"
            test -d "$TMP/compiled/V5TwoProcedure.mlmodelc"
            DEST="AnimaXS/Resources/ANE/Conv2048W8Template.bundle/V5TwoProcedure.mlmodelc"
            rm -rf "$DEST"
            cp -R "$TMP/compiled/V5TwoProcedure.mlmodelc" "$DEST"
            find "$DEST" -maxdepth 2 -type f -print

            if ! grep -q 'V5 existing-bridge diagnostic shims' AnimaXS/App/ANERingProbe.swift; then
              cat >> AnimaXS/App/ANERingProbe.swift <<'SWIFT'

          // MARK: - V5 existing-bridge diagnostic shims

          private extension A12ANEProjectionModel {
              func diagnosticDestroyMilliseconds() -> Double {
                  let started = ProcessInfo.processInfo.systemUptime
                  invalidate()
                  return (ProcessInfo.processInfo.systemUptime - started) * 1_000
              }
          }

          private extension A12ANEQKVModel {
              func diagnosticDestroyMilliseconds() -> Double {
                  let started = ProcessInfo.processInfo.systemUptime
                  invalidate()
                  return (ProcessInfo.processInfo.systemUptime - started) * 1_000
              }
          }

          private func A12ANEMultiProcedureProbe(
              _ compiledModelURL: URL,
              _ channels: UInt,
              _ spatial: UInt
          ) -> String {
              let fileManager = FileManager.default
              let cacheKey = "v5-two-procedure-poc"
              do {
                  guard let caches = fileManager.urls(for: .cachesDirectory, in: .userDomainMask).first else {
                      return "private multifunction ERROR: caches directory unavailable"
                  }
                  let base = caches.appendingPathComponent("AnimaXS-ANE", isDirectory: true)
                  try fileManager.createDirectory(at: base, withIntermediateDirectories: true)
                  let destination = base.appendingPathComponent("\(cacheKey).mlmodelc", isDirectory: true)
                  if fileManager.fileExists(atPath: destination.path) {
                      try fileManager.removeItem(at: destination)
                  }
                  try fileManager.copyItem(at: compiledModelURL, to: destination)

                  let loadStarted = ProcessInfo.processInfo.systemUptime
                  let model = try A12ANEProjectionModel(
                      preparedInputChannels: channels,
                      outputChannels: channels,
                      spatial: spatial,
                      label: "v5_two_procedure",
                      cacheKey: cacheKey)
                  let loadWall = (ProcessInfo.processInfo.systemUptime - loadStarted) * 1_000
                  let count = model.procedureCount
                  let summary = model.procedureSummary
                  let loadANE = model.loadMilliseconds
                  let unloadStarted = ProcessInfo.processInfo.systemUptime
                  model.invalidate()
                  let unloadWall = (ProcessInfo.processInfo.systemUptime - unloadStarted) * 1_000
                  try? fileManager.removeItem(at: destination)
                  return String(
                      format: "private multifunction: procedures=%lu summary=%@ loadANE=%.1fms loadWall=%.1fms unloadWall=%.1fms",
                      count, summary, loadANE, loadWall, unloadWall)
              } catch {
                  return "private multifunction ERROR: \(error.localizedDescription)"
              }
          }
          SWIFT
            fi

            python - <<'PY'
          from pathlib import Path

          p = Path('AnimaXS/App/ANERingProbe.swift')
          s = p.read_text().replace('unloadANE=', 'unloadCallSum=')
          p.write_text(s)

          d = Path('AnimaXS/App/DiagnosticsView.swift')
          s = d.read_text()
          s = s.replace(
              'Device-only ANE streaming-ring probe v3. Tests the production candidate with zero pinned blocks and only two block slices resident at once (8 current + 8 prefetched programs), including a full 28-block warm rotation and sustained load/evaluate overlap. It never runs automatically or modifies model weights.',
              'Device-only ANE Michelin probe v5. Measures synchronous destroy/unload, compares corrected 0+2 vs 0+3 vs 2+3 streaming, and independently probes whether a two-function Core ML asset appears as multiple private ANE procedures. It never runs automatically or modifies model weights.')
          s = s.replace('Run ANE streaming-ring probe', 'Run ANE Michelin probe v5')
          s = s.replace('Running ANE ring probe…', 'Running ANE Michelin probe…')
          d.write_text(s)
          PY

            git fetch origin main
            git checkout origin/main -- .github/workflows/ci.yml
            git rm -f .github/workflows/materialize-ane-v5.yml _ane_v5_trigger.txt || true
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'diag: materialize ANE Michelin V5 support'
            git push origin HEAD:probe/ane-v5-michelin
          ) > "$LOG" 2>&1
          STATUS=$?
          set -e
          cat "$LOG"

          if [ "$STATUS" -ne 0 ]; then
            {
              echo '❌ **ANE V5 materializer failed**'
              echo
              echo '```text'
              tail -n 180 "$LOG"
              echo '```'
            } > "$RUNNER_TEMP/v5-comment.md"
            gh pr comment 25 --repo invisiblestrangler/AnimaXS --body-file "$RUNNER_TEMP/v5-comment.md"
            exit "$STATUS"
          fi

          gh pr comment 25 --repo invisiblestrangler/AnimaXS --body '✅ **ANE V5 materializer succeeded.** Generated the two-function Core ML asset, added existing-bridge timing/procedure shims, restored normal CI, and pushed the materialized V5 branch.'
