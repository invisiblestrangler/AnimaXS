name: Regenerate ANE xcodeproj

on:
  push:
    branches:
      - ane-hybrid-integration

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ane-hybrid-integration
          fetch-depth: 0
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Regenerate committed project
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          xcodegen generate
          git diff --check
          git status --short
          rm -f .github/workflows/regenerate-ane-xcodeproj.yml
          git config user.name "AnimaXS CI"
          git config user.email "ci@anima-xs.local"
          git add -A
          git commit -m "chore: regenerate Xcode project for ANE backend"
          git push origin HEAD:ane-hybrid-integration
