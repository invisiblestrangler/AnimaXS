name: Materialize ANE V5 probe support

on:
  push:
    branches: [probe/ane-v5-michelin]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe/ane-v5-michelin
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build two-function Core ML POC asset
        run: |
          set -euo pipefail
          python -m pip install --quiet 'coremltools==8.1' numpy
          TMP="$RUNNER_TEMP/ane-v5-multifunction"
          rm -rf "$TMP"
          mkdir -p "$TMP"
          python - <<'PY'
          import os
          import numpy as np
          import coremltools as ct
          from coremltools.converters.mil import Builder as mb, types

          root = os.environ['RUNNER_TEMP'] + '/ane-v5-multifunction'

          def make_program(scale, path):
              weight = np.zeros((64, 64, 1, 1), dtype=np.float16)
              for i in range(64):
                  weight[i, i, 0, 0] = np.float16(scale)

              @mb.program(
                  input_specs=[mb.TensorSpec(shape=(1, 64, 1, 64), dtype=types.fp16)],
                  opset_version=ct.target.iOS18,
              )
              def prog(x):
                  return mb.conv(x=x, weight=weight, pad_type='valid', name='y')

              model = ct.convert(
                  prog,
                  convert_to='mlprogram',
                  minimum_deployment_target=ct.target.iOS18,
                  compute_precision=ct.precision.FLOAT16,
              )
              model.save(path)

          a = os.path.join(root, 'proc_a.mlpackage')
          b = os.path.join(root, 'proc_b.mlpackage')
          out = os.path.join(root, 'V5TwoProcedure.mlpackage')
          make_program(1.0, a)
          make_program(2.0, b)

          desc = ct.utils.MultiFunctionDescriptor()
          desc.add_function(a, 'main', 'identity')
          desc.add_function(b, 'main', 'double')
          desc.default_function_name = 'identity'
          ct.utils.save_multifunction(desc, out)
          print('multifunction package:', out)
          PY

          mkdir -p "$TMP/compiled"
          xcrun coremlcompiler compile "$TMP/V5TwoProcedure.mlpackage" "$TMP/compiled"
          test -d "$TMP/compiled/V5TwoProcedure.mlmodelc"
          DEST="AnimaXS/Resources/ANE/Conv2048W8Template.bundle/V5TwoProcedure.mlmodelc"
          rm -rf "$DEST"
          cp -R "$TMP/compiled/V5TwoProcedure.mlmodelc" "$DEST"
          find "$DEST" -maxdepth 2 -type f -print

      - name: Patch diagnostic bridge and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          h = Path('AnimaXS/Runtime/ANE/A12ANEBridge.h')
          s = h.read_text()
          cap = 'FOUNDATION_EXPORT NSString *A12ANEClientCapabilitySummary(void);\n'
          insert = cap + '''/// V5 diagnostic: inspect a compiled multifunction Core ML asset through the\n/// private _ANEModel path. Returns procedure metadata plus private load/unload timing.\nFOUNDATION_EXPORT NSString *A12ANEMultiProcedureProbe(\n    NSURL *compiledModelURL, NSUInteger channels, NSUInteger spatial);\n'''
          if s.count(cap) != 1:
              raise SystemExit('header capability anchor mismatch')
          s = s.replace(cap, insert)
          reload_decl = '''- (double)diagnosticReloadMilliseconds;\n- (void)invalidate;'''
          destroy_decl = '''- (double)diagnosticReloadMilliseconds;\n/// V5 diagnostic: unload residency, destroy retained _ANEModel, and return private unload milliseconds.\n/// Returns -1 on private-runtime failure.\n- (double)diagnosticDestroyMilliseconds;\n- (void)invalidate;'''
          if s.count(reload_decl) != 2:
              raise SystemExit(f'header reload anchors={s.count(reload_decl)}')
          s = s.replace(reload_decl, destroy_decl)
          h.write_text(s)

          m = Path('AnimaXS/Runtime/ANE/A12ANEBridge.m')
          s = m.read_text()
          old_unload = '''static BOOL A12UnloadModel(id client, id model, NSError **error) {\n    return ((BOOL(*)(id,SEL,id,id,unsigned int,NSError **))objc_msgSend)(\n        client, NSSelectorFromString(@"unloadModel:options:qos:error:"), model, A12Options(), 25, error);\n}\n'''
          new_unload = '''static BOOL A12UnloadModelTimed(id client, id model, NSError **error, double *milliseconds) {\n    uint64_t start = mach_absolute_time();\n    BOOL ok = ((BOOL(*)(id,SEL,id,id,unsigned int,NSError **))objc_msgSend)(\n        client, NSSelectorFromString(@"unloadModel:options:qos:error:"), model, A12Options(), 25, error);\n    if (milliseconds) *milliseconds = A12Milliseconds(mach_absolute_time() - start);\n    return ok;\n}\n\nstatic BOOL A12UnloadModel(id client, id model, NSError **error) {\n    return A12UnloadModelTimed(client, model, error, NULL);\n}\n'''
          if s.count(old_unload) != 1:
              raise SystemExit('unload helper anchor mismatch')
          s = s.replace(old_unload, new_unload)

          eval_anchor = '''static BOOL A12Evaluate(id client, id model, id request, NSError **error, double *milliseconds) {\n    uint64_t start = mach_absolute_time();\n    BOOL ok = ((BOOL(*)(id,SEL,id,id,id,unsigned int,NSError **))objc_msgSend)(\n        client, NSSelectorFromString(@"evaluateWithModel:options:request:qos:error:"),\n        model, A12Options(), request, 25, error);\n    if (milliseconds) *milliseconds = A12Milliseconds(mach_absolute_time() - start);\n    return ok;\n}\n'''
          multiproc = eval_anchor + '''\nNSString *A12ANEMultiProcedureProbe(NSURL *compiledModelURL, NSUInteger channels, NSUInteger spatial) {\n    if (!compiledModelURL) return @"private multifunction ERROR: nil URL";\n    if (!A12ANEIsAvailable()) return [@"private multifunction ERROR: " stringByAppendingString:A12ANERuntimeStatus()];\n    @try {\n        Class modelClass = NSClassFromString(@"_ANEModel");\n        Class clientClass = NSClassFromString(@"_ANEClient");\n        id model = ((id(*)(Class,SEL,id,id))objc_msgSend)(\n            modelClass, NSSelectorFromString(@"modelAtURL:key:"),\n            compiledModelURL, A12GenericKey(spatial, channels, channels));\n        if (!model) return @"private multifunction ERROR: _ANEModel modelAtURL:key returned nil";\n\n        NSDictionary *attrs = A12ModelAttributes(model);\n        id descValue = attrs[@"ANEFModelDescription"];\n        NSDictionary *desc = [descValue isKindOfClass:NSDictionary.class] ? descValue : @{};\n        id proceduresValue = desc[@"ANEFModelProcedures"];\n        NSArray *procedures = [proceduresValue isKindOfClass:NSArray.class] ? proceduresValue : @[];\n        id namesValue = desc[@"kANEFModelProcedureNameToIDMapKey"];\n        NSDictionary *names = [namesValue isKindOfClass:NSDictionary.class] ? namesValue : @{};\n\n        id client = ((id(*)(Class,SEL))objc_msgSend)(clientClass, NSSelectorFromString(@"sharedConnection"));\n        if (!client) return [NSString stringWithFormat:@"private multifunction: procedures=%lu names=%@ load=SKIP(no client)", (unsigned long)procedures.count, A12String(names)];\n        NSError *loadError = nil;\n        double loadMS = 0;\n        BOOL loaded = A12LoadModel(client, model, &loadError, &loadMS);\n        if (!loaded) {\n            return [NSString stringWithFormat:@"private multifunction: procedures=%lu names=%@ load=FAIL %@", (unsigned long)procedures.count, A12String(names), A12String(loadError)];\n        }\n        NSError *unloadError = nil;\n        double unloadMS = 0;\n        BOOL unloaded = A12UnloadModelTimed(client, model, &unloadError, &unloadMS);\n        return [NSString stringWithFormat:@"private multifunction: procedures=%lu names=%@ load=%.1fms unload=%@%.1fms%@",\n            (unsigned long)procedures.count, A12String(names), loadMS, unloaded ? @"" : @"FAIL ", unloadMS, unloaded ? @"" : [@" " stringByAppendingString:A12String(unloadError)]];\n    } @catch (NSException *exception) {\n        return [@"private multifunction EXCEPTION: " stringByAppendingString:A12String(exception)];\n    }\n}\n'''
          if s.count(eval_anchor) != 1:
              raise SystemExit('evaluate helper anchor mismatch')
          s = s.replace(eval_anchor, multiproc)

          destroy_method = '''\n- (double)diagnosticDestroyMilliseconds {\n    if (!_model || !_client) return _loaded ? -1.0 : 0.0;\n    if (!_loaded) { _model = nil; return 0.0; }\n    NSError *unloadError = nil;\n    double unloadMS = 0;\n    BOOL ok = A12UnloadModelTimed(_client, _model, &unloadError, &unloadMS);\n    if (!ok) return -1.0;\n    _loaded = NO;\n    _model = nil;\n    return unloadMS;\n}\n\n'''
          inv_anchor = '''    _loadMilliseconds = loadMS;\n    return loadMS;\n}\n\n- (void)invalidate {'''
          inv_replace = '''    _loadMilliseconds = loadMS;\n    return loadMS;\n}\n''' + destroy_method + '''- (void)invalidate {'''
          if s.count(inv_anchor) != 2:
              raise SystemExit(f'invalidate anchors={s.count(inv_anchor)}')
          s = s.replace(inv_anchor, inv_replace)
          m.write_text(s)

          d = Path('AnimaXS/App/DiagnosticsView.swift')
          s = d.read_text()
          s = s.replace(
              'Device-only ANE streaming-ring probe v3. Tests the production candidate with zero pinned blocks and only two block slices resident at once (8 current + 8 prefetched programs), including a full 28-block warm rotation and sustained load/evaluate overlap. It never runs automatically or modifies model weights.',
              'Device-only ANE Michelin probe v5. Measures timed private unload, compares corrected 0+2 vs 0+3 vs 2+3 streaming, and independently probes whether a two-function Core ML asset becomes multiple private ANE procedures. It never runs automatically or modifies model weights.')
          s = s.replace('Run ANE streaming-ring probe', 'Run ANE Michelin probe v5')
          s = s.replace('Running ANE ring probe…', 'Running ANE Michelin probe…')
          d.write_text(s)
          PY

      - name: Self-delete materializer trigger
        run: |
          git rm .github/workflows/materialize-ane-v5.yml
          git rm -f _ane_v5_trigger.txt

      - name: Commit generated support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AnimaXS/Runtime/ANE/A12ANEBridge.h AnimaXS/Runtime/ANE/A12ANEBridge.m AnimaXS/App/DiagnosticsView.swift
          git add AnimaXS/Resources/ANE/Conv2048W8Template.bundle/V5TwoProcedure.mlmodelc
          git add -u .github/workflows/materialize-ane-v5.yml _ane_v5_trigger.txt || true
          git commit -m 'diag: materialize ANE Michelin V5 support'
          git push origin HEAD:probe/ane-v5-michelin
