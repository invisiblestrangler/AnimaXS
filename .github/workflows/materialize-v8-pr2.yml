name: Materialize V8 projection sweep final

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe/ane-projection-sweep-v8
          fetch-depth: 0

      - name: Tighten V8 and wire Diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new)

          probe = Path('AnimaXS/App/ANEProjectionSweepV8.swift')
          s = probe.read_text()
          s = replace_once(
              s,
              '&& relativeRMSE < relativeRMSELimit',
              '&& relativeRMSE < ANEProjectionSweepV8.relativeRMSELimit',
              'qualified RMSE limit')
          s = replace_once(
              s,
              '''    private static func sweepBlock(
        file: AnimapkFile,
        factory: ModelFactory,
        context: MetalContext,
        block: Int
    ) throws -> [Measurement] {
        let surfaces = try ANEW8DiTSurfaces(device: context.device)
''',
              '''    private static func sweepBlock(
        file: AnimapkFile,
        factory: ModelFactory,
        surfaces: ANEW8DiTSurfaces,
        block: Int
    ) throws -> [Measurement] {
''',
              'single reusable surface signature')
          s = replace_once(
              s,
              '''            let factory = ModelFactory(file: file)
            let kernels = ProbeKernels(context: context)
''',
              '''            let factory = ModelFactory(file: file)
            let kernels = ProbeKernels(context: context)
            // Match production lifetime: allocate the IOSurface set once and
            // reuse it for all 28 blocks instead of introducing allocator churn.
            let surfaces = try ANEW8DiTSurfaces(device: context.device)
''',
              'single reusable surface allocation')
          s = replace_once(
              s,
              '''                    blockMeasurements = try sweepBlock(
                        file: file, factory: factory,
                        context: context, block: block)
''',
              '''                    blockMeasurements = try sweepBlock(
                        file: file, factory: factory,
                        surfaces: surfaces, block: block)
''',
              'surface call site')
          s = replace_once(
              s,
              'seed: UInt64(rows) << 32 ^ UInt64(channels) ^ 0x1A90_0008)',
              'seed: (UInt64(rows) << 32) ^ UInt64(channels) ^ 0x1A90_0008)',
              'seed precedence')
          probe.write_text(s)

          view = Path('AnimaXS/App/DiagnosticsView.swift')
          v = view.read_text()
          v = replace_once(
              v, 'Section("ANE residency / load probe") {',
              'Section("ANE correctness probe") {', 'section title')
          v = replace_once(
              v,
              'Text("Device-only ANE Michelin probe v5. Measures synchronous destroy/unload, compares corrected 0+2 vs 0+3 vs 2+3 streaming, and independently probes whether a two-function Core ML asset appears as multiple private ANE procedures. It never runs automatically or modifies model weights.")',
              'Text("Device-only ANE native projection sweep v8. Re-checks page-valid production layout bridges, then validates all 280 native projection tensors / 224 prepared ANE programs across 28 blocks against the pack’s independent U8-per-row CPU contract. The projection sweep bypasses the layout kernels with direct plane-major IOSurface I/O. It never runs automatically or changes production inference.")',
              'description')
          v = replace_once(
              v,
              '? "Running ANE Michelin probe…" : "Run ANE Michelin probe v5")',
              '? "Running ANE projection sweep…" : "Run ANE projection sweep v8")',
              'button label')
          v = replace_once(
              v, 'await ANERingProbe.run()',
              'await ANEProjectionSweepV8.run()', 'probe call')
          view.write_text(v)
          PY

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Regenerate and commit final branch
        run: |
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          xcodegen version
          xcodegen generate
          rm -f \
            .github/workflows/materialize-v8.yml \
            .github/workflows/materialize-v8-pr.yml \
            .github/workflows/materialize-v8-pr2.yml \
            .trigger-v8-pr \
            V8_PROBE_NOTES.md \
            V8_EXPECTED_OUTPUT.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire ANE projection sweep v8"
          git push origin HEAD:probe/ane-projection-sweep-v8
