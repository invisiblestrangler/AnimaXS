name: Quality FP16 fidelity ceiling

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      HF_TOKEN:
        required: true

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  SOURCE_REPO: circlestone-labs/Anima
  SOURCE_REVISION: f7382c4bf9d7ffe4ceea593a0adbb470c56dd79b
  SOURCE_FILE: split_files/diffusion_models/anima-turbo-v1.0.safetensors
  SOURCE_SHA: c0b905034510750a505d21aa96c81718f4ffcc500777318421f58a88636e2174

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Install packer dependencies
        run: |
          python -m pip install numpy safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact source
        env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/anima.safetensors"
          curl --fail --location --retry 3 --retry-all-errors -H "Authorization: Bearer $HF_TOKEN" -o "$source" \
            "https://huggingface.co/$SOURCE_REPO/resolve/$SOURCE_REVISION/$SOURCE_FILE?download=true"
          echo "$SOURCE_SHA  $source" | sha256sum --check
          echo "SOURCE=$source" >> "$GITHUB_ENV"
      - name: Pack and verify sensitive FP16 candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          python scripts/pack_anima.py --component dit --input "$SOURCE" \
            --out "$RUNNER_TEMP/candidate/anima-w8-sensitive-fp16.animapk" \
            --quant w8 --group 64 --precision-map scripts/w8-sensitive-fp16.json \
            --report "$RUNNER_TEMP/candidate/packing-report.json" --verify
          python scripts/verify_animapk.py "$RUNNER_TEMP/candidate/anima-w8-sensitive-fp16.animapk" \
            --report "$RUNNER_TEMP/candidate/verification-report.json"
          (cd "$RUNNER_TEMP/candidate" && sha256sum anima-w8-sensitive-fp16.animapk > sha256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: w8-sensitive-pack-${{ github.sha }}
          retention-days: 3
          compression-level: 0
          path: ${{ runner.temp }}/candidate

  latent:
    needs: pack
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: w8-sensitive-pack-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          if ! xcrun --find metal >/dev/null 2>&1; then xcodebuild -downloadComponent MetalToolchain; fi
          curl --fail --location --silent --show-error https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
      - name: Install candidate and Qwen fixture
        run: |
          set -euo pipefail
          fixture=AnimaXSTests/Fixtures/Case1Binary
          cp "$RUNNER_TEMP/candidate/anima-w8-sensitive-fp16.animapk" "$fixture/anima-turbo-refine.animapk"
          curl --fail --location --retry 3 --retry-all-errors -o "$fixture/qwen3-0.6b-xsmax-w8.animapk" \
            https://github.com/invisiblestrangler/AnimaXS/releases/download/model-assets-v1/qwen3-0.6b-xsmax-w8.animapk
          echo "ba59e4d1797de5f6512aeafcecf3f38e1f62a47313a2a400b949c9018d84ceab  $fixture/qwen3-0.6b-xsmax-w8.animapk" | shasum -a 256 --check
          printf '%s\n' '{"attention_numerics":"legacy","latent_only":"1"}' > "$fixture/quality-diagnostic.json"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Run canonical latent inference
        run: |
          set -euo pipefail
          destination=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for r in d['devices'].values() for x in r if 'iPhone' in x['name'] and x['isAvailable']))")
          xcodebuild -project AnimaXS.xcodeproj -scheme AnimaXS -configuration Debug \
            -destination "platform=iOS Simulator,id=$destination" -derivedDataPath .derivedData \
            CODE_SIGNING_ALLOWED=NO -only-testing:AnimaXSTests/FullInferenceTests/testCanonicalProductionInference \
            test 2>&1 | tee "$RUNNER_TEMP/w8-sensitive-latent.log"
          grep -q 'FULL_LATENT_ONLY=PASS' "$RUNNER_TEMP/w8-sensitive-latent.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w8-sensitive-latent-${{ github.sha }}
          retention-days: 14
          path: ${{ runner.temp }}/w8-sensitive-latent.log
