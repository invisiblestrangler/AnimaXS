name: E009 pack-backed parity

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag containing e009-block0-fixture.tar.zst
        required: true
        default: e009-fixture-temp
      asset:
        description: Fixture archive asset name
        required: true
        default: e009-block0-fixture.tar.zst
      all_blocks:
        description: Run H006 all-block finiteness instead of E009 block parity
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  block-zero:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .derivedData/SourcePackages
          key: animaxs-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', 'project.yml') }}
          restore-keys: animaxs-spm-${{ runner.os }}-
      - name: Select toolchain and simulator
        id: sim
        run: |
          sudo xcode-select -s "$DEVELOPER_DIR"
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
          DEST=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json;d=json.load(sys.stdin);[print(x['udid']) for v in d['devices'].values() for x in v if 'iPhone' in x['name'] and x['isAvailable']]" \
            | head -1)
          test -n "$DEST"
          echo "sim=$DEST" >> "$GITHUB_OUTPUT"
      - name: Download compact real-weight fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/e009"
          gh release download "${{ inputs.release }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ inputs.asset }}" \
            --dir "$RUNNER_TEMP/e009"
          tar --zstd -xf "$RUNNER_TEMP/e009/${{ inputs.asset }}" \
            -C "$RUNNER_TEMP/e009"
          mkdir -p AnimaXSTests/Fixtures/E009
          cp -R "$RUNNER_TEMP/e009/packs" "$RUNNER_TEMP/e009/oracle" \
            AnimaXSTests/Fixtures/E009/
      - name: Regenerate the ephemeral fixture-bearing test project
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Run real block-0 parity
        env:
          ANIMAXS_PACKS_DIR: ${{ runner.temp }}/e009/packs
          ANIMAXS_BLOCK0_ORACLE_DIR: ${{ runner.temp }}/e009/oracle
          ANIMAXS_RUN_ALL_DIT_BLOCKS: ${{ inputs.all_blocks && '1' || '0' }}
        run: |
          set -o pipefail
          if [ "${{ inputs.all_blocks }}" = "true" ]; then
            TEST=AnimaXSTests/DiTBlockExecutorTests/testRealPackAllBlocksAreFinite
            METRIC=H006_ALL_BLOCKS
          else
            TEST=AnimaXSTests/DiTBlockExecutorTests/testRealPackBlock0AgainstSameW4Oracle
            METRIC=E009_BLOCK0
          fi
          xcodebuild \
            -project AnimaXS.xcodeproj \
            -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.sim }}" \
            -derivedDataPath .derivedData \
            -only-testing:"$TEST" \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee e009-parity.log
          grep "$METRIC" e009-parity.log | tee -a "$GITHUB_STEP_SUMMARY"
        timeout-minutes: 30
