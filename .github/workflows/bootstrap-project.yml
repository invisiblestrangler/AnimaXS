name: bootstrap-project

# One-shot: generates AnimaXS.xcodeproj from project.yml on a macOS runner and commits it back.
# Run manually from the Actions tab after a project.yml change, or automatically after merge.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Commit generated project (if changed)
        run: |
          # git diff ignores untracked files, so check tracking status explicitly.
          TRACKED=$(git ls-files --error-unmatch AnimaXS.xcodeproj >/dev/null 2>&1 && echo yes || echo no)
          DIRTY=$(git status --porcelain -- AnimaXS.xcodeproj | wc -l | tr -d ' ')
          if [ "$TRACKED" = "no" ] || [ "$DIRTY" != "0" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AnimaXS.xcodeproj
            git commit -m "chore: regenerate AnimaXS.xcodeproj from project.yml"
            git push
          else
            echo "No project changes."
          fi
