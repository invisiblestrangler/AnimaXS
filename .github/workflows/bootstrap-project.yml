name: bootstrap-project

# One-shot: generates AnimaXS.xcodeproj from project.yml on a macOS runner and commits it back.
# Run manually from the Actions tab after a project.yml change, or automatically after merge.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_ZIP_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "${XCODEGEN_ZIP_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/xcodegen/bin:$PATH"
          xcodegen version

      - name: Generate project
        run: xcodegen generate

      - name: Commit generated project (if changed)
        run: |
          # git diff ignores untracked files, so check tracking status explicitly.
          TRACKED=$(git ls-files --error-unmatch AnimaXS.xcodeproj >/dev/null 2>&1 && echo yes || echo no)
          DIRTY=$(git status --porcelain -- AnimaXS.xcodeproj | wc -l | tr -d ' ')
          if [ "$TRACKED" = "no" ] || [ "$DIRTY" != "0" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add AnimaXS.xcodeproj
            git commit -m "chore: regenerate AnimaXS.xcodeproj from project.yml"
            git push
          else
            echo "No project changes."
          fi
