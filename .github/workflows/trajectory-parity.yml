name: Trajectory parity

on:
  workflow_dispatch:
    inputs:
      pack_artifact_run_id:
        description: "Reuse packed candidates from this prior run ID"
        required: false
        default: "31701142683"
        type: string
      pack_artifact_sha:
        description: "Commit SHA the reused pack artifact was uploaded under"
        required: false
        default: "357bfb1f9e9f5194e6c409a761cab0b831804880"
        type: string

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  SOURCE_REPO: circlestone-labs/Anima
  SOURCE_REVISION: f7382c4bf9d7ffe4ceea593a0adbb470c56dd79b
  SOURCE_FILE: split_files/diffusion_models/anima-turbo-v1.0.safetensors
  SOURCE_SHA256: c0b905034510750a505d21aa96c81718f4ffcc500777318421f58a88636e2174
  QWEN_FILE: qwen3-0.6b-xsmax-fp16-matrices.animapk
  DIT_FILE: anima-turbo-v1.0-xsmax-fp16-all.animapk
  VAE_FILE: qwen-image-vae-xsmax-fp16.animapk
  VAE_RELEASE: model-assets-v1
  VAE_SHA256: 10171af0b826927b75fecf4482aaa0e268254874e694a0788ebdd8c4254fc447

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bf16-production
            activation_numerics: bf16_compute
          - name: legacy-production
            activation_numerics: legacy
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode and ensure Metal toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s "$DEVELOPER_DIR"
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
            sudo xcode-select -s "$DEVELOPER_DIR"
          fi
      - name: Install pinned XcodeGen
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$RUNNER_TEMP/xcodegen.zip"
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
      - name: Download packed candidates
        uses: actions/download-artifact@v5
        with:
          name: qwen-fp16-pack-${{ inputs.pack_artifact_sha }}
          path: ${{ runner.temp }}/candidates
          run-id: ${{ inputs.pack_artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare fixtures with trajectory capture
        run: |
          set -euo pipefail
          fixture="AnimaXSTests/Fixtures/Case1Binary"
          cp "$RUNNER_TEMP/candidates/$QWEN_FILE" "$fixture/qwen3-0.6b-xsmax-w8.animapk"
          shopt -s nullglob
          parts=("$RUNNER_TEMP/candidates/$DIT_FILE.part-"*)
          ((${#parts[@]} > 0)) || { echo "::error::no DiT pack chunks found"; exit 1; }
          cat "${parts[@]}" > "$RUNNER_TEMP/$DIT_FILE"
          expected=$(awk '{print $1}' "$RUNNER_TEMP/candidates/dit-pack.sha256")
          actual=$(shasum -a 256 "$RUNNER_TEMP/$DIT_FILE" | awk '{print $1}')
          test "$actual" = "$expected" || {
            echo "::error::DiT pack digest mismatch: expected $expected, got $actual"
            exit 1
          }
          cp "$RUNNER_TEMP/$DIT_FILE" "$fixture/anima-turbo-refine.animapk"
          curl --fail --location --retry 3 --retry-all-errors -o "$fixture/$VAE_FILE" \
            https://github.com/invisiblestrangler/AnimaXS/releases/download/$VAE_RELEASE/$VAE_FILE
          echo "$VAE_SHA256  $fixture/$VAE_FILE" | shasum -a 256 --check
          printf '%s\n' "{\"attention_numerics\":\"legacy\",\"activation_numerics\":\"${{ matrix.activation_numerics }}\",\"golden_qwen_context\":\"0\",\"capture_trajectory\":\"1\"}" \
            > "$fixture/quality-diagnostic.json"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          destination=$(xcrun simctl list devices available -j | python3 -c \
            "import json,sys; d=json.load(sys.stdin); print(next(x['udid'] for r in d['devices'].values() for x in r if 'iPhone' in x['name'] and x['isAvailable']))")
          echo "id=$destination" >> "$GITHUB_OUTPUT"
      - name: Run canonical full-image inference with per-step capture
        run: |
          set -euo pipefail
          xcodebuild -project AnimaXS.xcodeproj -scheme AnimaXS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath .derivedData CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/qwen-fp16-full.xcresult" \
            -only-testing:AnimaXSTests/FullInferenceTests/testCanonicalProductionInference \
            test 2>&1 | tee "$RUNNER_TEMP/qwen-fp16-full.log"
          grep -q 'FULL_QWEN_CONTEXT=production' "$RUNNER_TEMP/qwen-fp16-full.log"
          grep -q 'FULL_INFERENCE=PASS' "$RUNNER_TEMP/qwen-fp16-full.log"
        timeout-minutes: 90
      - name: Export trajectory evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exported" "$RUNNER_TEMP/trajectory"
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/qwen-fp16-full.xcresult" --output-path "$RUNNER_TEMP/exported"
          python3 scripts/export_full_inference_attachments.py \
            "$RUNNER_TEMP/exported" "$RUNNER_TEMP/trajectory"
          cp "$RUNNER_TEMP/qwen-fp16-full.log" "$RUNNER_TEMP/trajectory/"
          ls -la "$RUNNER_TEMP/trajectory/"
      - name: Upload trajectory capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trajectory-capture-${{ matrix.name }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/trajectory

  source-oracle:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install torch and safetensors
        run: |
          set -euo pipefail
          python -m pip install numpy safetensors
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download trajectory captures
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/captures
          pattern: trajectory-capture-*
          github-token: ${{ github.token }}
      - name: Download and verify pinned DiT source
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${HF_TOKEN:-}" || { echo "::error::HF_TOKEN missing"; exit 1; }
          source="$RUNNER_TEMP/dit-source.safetensors"
          curl --fail --location --retry 3 --retry-all-errors --progress-bar \
            -H "Authorization: Bearer $HF_TOKEN" -o "$source" \
            "https://huggingface.co/$SOURCE_REPO/resolve/$SOURCE_REVISION/$SOURCE_FILE?download=true"
          echo "$SOURCE_SHA256  $source" | sha256sum --check
          echo "SOURCE=$source" >> "$GITHUB_ENV"
      - name: Run source trajectory parity + end-to-end oracle
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oracle-evidence"
          for dir in "$RUNNER_TEMP"/captures/trajectory-capture-*; do
            name=$(basename "$dir" | sed 's/trajectory-capture-//')
            out="$RUNNER_TEMP/oracle-evidence/$name"
            mkdir -p "$out"
            echo "=== trajectory parity: $name ==="
            python3 scripts/dit_source_oracle.py --source "$RUNNER_TEMP/dit-source.safetensors" \
              --mode trajectory --capture "$dir" --out "$out" --dtype bf16
            echo "=== trajectory parity fp32: $name ==="
            python3 scripts/dit_source_oracle.py --source "$RUNNER_TEMP/dit-source.safetensors" \
              --mode trajectory --capture "$dir" --out "$out" --dtype fp32
          done
          echo "=== end-to-end source run (bf16) vs golden ==="
          python3 scripts/dit_source_oracle.py --source "$RUNNER_TEMP/dit-source.safetensors" \
            --mode endtoend --fixtures AnimaXSTests/Fixtures/Case1Binary \
            --out "$RUNNER_TEMP/oracle-evidence" --dtype bf16
          echo "=== end-to-end source run (fp32) vs golden ==="
          python3 scripts/dit_source_oracle.py --source "$RUNNER_TEMP/dit-source.safetensors" \
            --mode endtoend --fixtures AnimaXSTests/Fixtures/Case1Binary \
            --out "$RUNNER_TEMP/oracle-evidence" --dtype fp32
      - name: Upload oracle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-oracle-evidence-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/oracle-evidence
