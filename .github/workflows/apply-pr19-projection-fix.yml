name: Apply PR 19 Projection Fix

on:
  push:
    branches: [feat/ane-native-w8-pack]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ane-native-w8-pack
      - name: Apply exact projection bridge fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('AnimaXS/Runtime/ANE/ANEW8MLPBackend.swift')
          lines = p.read_text().splitlines()

          start_matches = [i for i, line in enumerate(lines)
                           if '_ = try A12ANEPrepareProjectionModel(' in line]
          if len(start_matches) != 1:
              raise SystemExit(f'expected exactly one old projection call, got {len(start_matches)}')
          start = start_matches[0]
          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]

          end = None
          for i in range(start + 1, min(len(lines), start + 12)):
              if '"dit_b\\(block)_\\(spec.tag)", key)' in lines[i]:
                  end = i
                  break
          if end is None:
              raise SystemExit('projection call closing line not found')

          original_args = lines[start + 1:end]
          replacement = [
              indent + 'var prepareError: NSError?',
              indent + 'guard A12ANEPrepareProjectionModel(',
              *original_args,
              indent + '    "dit_b\\(block)_\\(spec.tag)", key, &prepareError) else {',
              indent + '    throw prepareError ?? AnimapkError.validation(',
              indent + '        "failed to prepare ANE projection \\(spec.tag) for block \\(block)")',
              indent + '}',
          ]
          lines[start:end + 1] = replacement
          text = '\n'.join(lines) + '\n'

          if '_ = try A12ANEPrepareProjectionModel(' in text:
              raise SystemExit('old projection call remains after transform')
          if text.count('guard A12ANEPrepareProjectionModel(') != 1:
              raise SystemExit('expected exactly one guarded projection call')
          if '"dit_b\\(block)_\\(spec.tag)", key, &prepareError) else {' not in text:
              raise SystemExit('projection NSError argument was not installed')

          p.write_text(text)
          PY
          swiftc -parse AnimaXS/Runtime/ANE/ANEW8MLPBackend.swift
          git diff --check
          git diff --exit-code --quiet && { echo 'No source change produced'; exit 1; } || true
          git diff -- AnimaXS/Runtime/ANE/ANEW8MLPBackend.swift
      - name: Commit exact source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AnimaXS/Runtime/ANE/ANEW8MLPBackend.swift
          git commit -m 'Fix ANE projection NSError bridge call'
          git push origin HEAD:feat/ane-native-w8-pack
